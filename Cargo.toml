[package]
name = "chronolens"
version = "1.0.0"
description = "ChronoLens — Time-Travel Local State & Data Debugger"
authors = ["Albatany"]
edition = "2026"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File-system mutation events (inotify / ReadDirectoryChangesW / FSEvents)
notify = "6"
# Cross-platform process polling (RSS, virtual memory, CPU). Only the "system" feature is
# enabled so disks / networks / components are not compiled in.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# Smaller + faster than std::sync::Mutex and has no lock poisoning.
parking_lot = "0.12"

# Native handle / thread counters on Windows (Linux reads /proc directly, no crate needed).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

# ─── Deep release optimisation for low-end machines ────────────────────────────────────
[profile.release]
opt-level = "s"        # optimise for size ("z" is smaller still, but slower replay)
lto = true             # link-time optimisation across all crates
codegen-units = 1      # single codegen unit => best inlining / smallest output
panic = "abort"        # no unwinding tables
strip = true           # drop symbols
incremental = false
